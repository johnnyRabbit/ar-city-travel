<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Évora Through Time — Jogo Histórico de Exploração</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.light, html.light body { background-color: #ffffff !important; color: #000000; }
      html.dark, html.dark body { background-color: #1a1a1a !important; color: #ffffff; }
      .player-marker, .zombie-marker, .event-marker { background: none !important; border: none !important; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
      @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes slide-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
      .animate-slide-in { animation: slide-in 0.3s ease-out; }
      .leaflet-container { width: 100%; height: 100%; z-index: 0; }
      .leaflet-control-attribution { font-size: 8px !important; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      
      /* Fix scroll in UI panels on mobile */
      .overflow-y-auto, .overflow-auto {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        touch-action: pan-y !important;
      }
      
      /* Prevent map from capturing scroll in panels */
      .leaflet-container {
        touch-action: none;
      }
      
      /* Ensure panels can scroll on mobile */
      [class*="backdrop-blur"] {
        -webkit-overflow-scrolling: touch;
      }
      
      /* Fix for iOS Safari scroll */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <script>
      (function () {
        const isInIframe = window.self !== window.top;
        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        if (isInIframe) {
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") applyThemeToDOM(theme);
            }
          });
        } else { applyThemeToDOM("light"); }
      })();
    </script>
    <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage({ type: "sandbox-runtime-error", payload: { message: String(event.message).slice(0, 500), filename: event.filename || "", lineno: event.lineno || 0, colno: event.colno || 0, stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : "" } }, "*");
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
